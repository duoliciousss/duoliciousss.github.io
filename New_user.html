<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Matches</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        nav { background: #d6336c; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: bold; margin-left: 15px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px; background: #fff; margin-bottom: 20px; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .card h3 { margin: 10px 0 5px; color: #333; }
        .card p { color: #777; font-size: 0.9rem; }
        .btn { background: #d6336c; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #b02a5b; }

        /* Assistant styles */
        .assistant-btn { position: fixed; bottom: 20px; right: 20px; background: #d6336c; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 999; }
        .assistant-modal { display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; max-width: 90%; background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; overflow: hidden; }
        .assistant-header { background: #d6336c; color: white; padding: 15px; font-weight: bold; }
        .assistant-body { padding: 15px; max-height: 300px; overflow-y: auto; }
        .assistant-msg { margin: 5px 0; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
        .assistant-msg.user { background: #d6336c; color: white; margin-left: auto; }
        .assistant-msg.bot { background: #f0f0f0; }
        .assistant-input { display: flex; padding: 10px; border-top: 1px solid #eee; }
        .assistant-input input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .assistant-input button { background: #d6336c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        .choice-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #fff; border: 1px solid #d6336c; color: #d6336c; border-radius: 5px; cursor: pointer; text-align: left; }
        .choice-btn:hover { background: #d6336c; color: white; }

        /* Form popup */
        .form-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 350px; max-width: 90%; z-index: 1000; }
        .form-popup h3 { margin-top: 0; color: #d6336c; }
        .form-popup label { display: block; margin: 10px 0 5px; font-weight: bold; }
        .form-popup input, .form-popup select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .form-popup button { margin-top: 15px; width: 100%; padding: 10px; background: #d6336c; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .close-form { float: right; cursor: pointer; font-size: 20px; }

        /* Chat modal */
        .chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .chat-box { background: white; width: 400px; max-width: 90%; border-radius: 15px; padding: 20px; }
        .chat-header { background: #d6336c; color: white; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 15px 15px 0 0; }
        .chat-messages { max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
        .msg { margin: 5px 0; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
        .msg.user { background: #d6336c; color: white; align-self: flex-end; margin-left: auto; }
        .msg.profile { background: #f0f0f0; }
        .typing { color: #888; font-style: italic; font-size: 0.9em; }
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .chat-input button { background: #d6336c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .close-chat { float: right; color: white; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Serenade Dates</a>
    <div>
        <a href="index.html">Home</a>
        <a href="serenade_about.html">About</a>
        <a href="New_user.html">Matches</a>
    </div>
</nav>

<div class="container">
    <header>
        <h1>Your Daily Matches</h1>
        <p>Based on your profile preferences</p>
    </header>
    <div class="grid" id="profilesContainer"></div>
</div>

<!-- Assistant Button -->
<button class="assistant-btn" onclick="toggleAssistant()">💬</button>

<!-- Assistant Modal -->
<div class="assistant-modal" id="assistantModal">
    <div class="assistant-header">Personal Match Assistant</div>
    <div class="assistant-body" id="assistantBody"></div>
    <div class="assistant-input">
        <input type="text" id="assistantInput" placeholder="Ask anything...">
        <button onclick="sendAssistant()">Send</button>
    </div>
</div>

<!-- Form Popup -->
<div class="form-popup" id="formPopup">
    <span class="close-form" onclick="closeForm()">×</span>
    <h3>Complete Your Profile</h3>
    <label>Age:</label>
    <input type="number" id="formAge" min="18" max="99">
    <label>Hair Color:</label>
    <select id="formColor">
        <option value="">Select...</option>
        <option value="blonde">Blonde</option>
        <option value="brunette">Brunette</option>
        <option value="black">Black</option>
        <option value="red">Red</option>
    </select>
    <label>Weight (kg):</label>
    <input type="number" id="formWeight" min="30" max="200">
    <label>Height (cm):</label>
    <input type="number" id="formHeight" min="140" max="220">
    <button onclick="saveForm()">Save Profile</button>
</div>

<!-- Chat Modal -->
<div class="chat-modal" id="chatModal">
    <div class="chat-box">
        <div class="chat-header">
            <span id="chatName"></span>
            <span style="font-size:0.8em; color:#ffd700;">● Online</span>
            <span class="close-chat" onclick="closeChat()">×</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendChat()">Send</button>
        </div>
    </div>
</div>

<script>
    // Profiles array
    const profiles = [
        { name: "Sarah, 26", bio: "Loves hiking, photography, and good coffee.", img: "https://picsum.photos/seed/user1/300/200" },
        { name: "James, 28", bio: "Gym enthusiast, movie lover, weekend traveler.", img: "https://picsum.photos/seed/user2/300/200" },
        { name: "Emily, 24", bio: "Bookworm, foodie, and dog mom.", img: "https://picsum.photos/seed/user3/300/200" },
        { name: "Michael, 30", bio: "Software engineer, guitarist, amateur chef.", img: "https://picsum.photos/seed/user4/300/200" },
        { name: "Olivia, 27", bio: "Yoga teacher, art lover, beach person.", img: "https://picsum.photos/seed/user5/300/200" },
        { name: "David, 29", bio: "Entrepreneur, sports fan, night owl.", img: "https://picsum.photos/seed/user6/300/200" },
        { name: "Sophia, 25", bio: "Musician, cat lover, weekend baker.", img: "https://picsum.photos/seed/user7/300/200" },
        { name: "Daniel, 31", bio: "Architect, history buff, wine enthusiast.", img: "https://picsum.photos/seed/user8/300/200" }
    ];

    // Smart reply function (human-like, contextual, varied)
    function getSmartReply(text) {
        const t = text.toLowerCase();
        // Age
        if (t.includes("age") || t.includes("old")) return ["I'm 27 😊. You?", "I'm 28. How about you?", "27, but I'm young at heart!"][Math.floor(Math.random()*3)];
        // Hobbies
        if (t.includes("hobby") || t.includes("like to do") || t.includes("free time")) return ["I love hiking and painting 😍. What about you?", "I'm into photography and good coffee. You?", "I love cooking and watching movies 🎬. What do you do?"][Math.floor(Math.random()*3)];
        // Music
        if (t.includes("music") || t.includes("song") || t.includes("sing")) return ["I'm into indie pop right now. Do you have a favorite artist? 🎶", "I love rock and jazz! What's your vibe?", "I listen to everything, but mostly lo-fi beats 😴"][Math.floor(Math.random()*3)];
        // Food
        if (t.includes("food") || t.includes("eat") || t.includes("hungry")) return ["I'm a total foodie! Sushi is my favorite 🍣. What's yours?", "Pizza is my weakness 😅. What about you?", "I love trying new restaurants! Any suggestions?"][Math.floor(Math.random()*3)];
        // Greetings
        if (t.includes("how are you") || t.includes("how r u") || t.includes("hru")) return ["I'm doing pretty well, just having a lazy Sunday 😊. You?", "All good! Just busy with work, but happy to chat with you. How are you?", "Pretty great! Thanks for asking 😉. You?"][Math.floor(Math.random()*3)];
        // Name
        if (t.includes("name") || t.includes("who are you")) return ["I'm David. It's nice to meet you! 😊", "I'm David, but my friends call me Dave. You?", "David! And you?"][Math.floor(Math.random()*3)];
        // Work
        if (t.includes("work") || t.includes("job") || t.includes("career")) return ["I work in marketing. It's pretty busy lately. What do you do? 💼", "I'm a graphic designer. I love my job! What about you?", "I run my own small business. It's exciting but tiring. You?"][Math.floor(Math.random()*3)];
        // Compliments
        if (t.includes("beautiful") || t.includes("cute") || t.includes("handsome")) return ["Aww thank you! 😊 You're making me blush.", "That's very sweet of you! You seem nice too 😉", "Haha, I appreciate that! What about you?"][Math.floor(Math.random()*3)];
        // Default
        return ["That's interesting! Tell me more about that.", "I see! What made you say that?", "Oh really? I'd love to hear more about it 😊", "Haha, that sounds fun!"][Math.floor(Math.random()*4)];
    }

    // Shuffle function
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Load random profiles
    function loadProfiles() {
        const container = document.getElementById("profilesContainer");
        const shuffledProfiles = shuffle(profiles);
        container.innerHTML = "";
        shuffledProfiles.forEach(profile => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${profile.img}" alt="${profile.name}">
                <h3>${profile.name}</h3>
                <p>${profile.bio}</p>
                <button class="btn" onclick="openChat('${profile.name}')">Connect</button>
            `;
            container.appendChild(card);
        });
    }

    // Assistant bot logic
    function toggleAssistant() {
        const modal = document.getElementById("assistantModal");
        const isOpen = modal.style.display === "block";
        modal.style.display = isOpen ? "none" : "block";
        if (!isOpen) {
            addAssistantMsg("bot", "Hi! I'm your Personal Match Assistant. Ask me about: age, color, weight, height, or type 'form' to open the profile form.");
        }
    }

    function addAssistantMsg(sender, text) {
        const body = document.getElementById("assistantBody");
        const div = document.createElement("div");
        div.className = "assistant-msg " + sender;
        div.textContent = text;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    function sendAssistant() {
        const input = document.getElementById("assistantInput");
        const text = input.value.trim().toLowerCase();
        if (text === "") return;
        addAssistantMsg("user", text);
        input.value = "";

        setTimeout(() => {
            let reply;
            if (text.includes("hello") || text.includes("hi")) {
                reply = "Hi! How can I help you find your perfect match today?";
                addChoiceButtons(["Age", "Color", "Weight", "Height", "Form"]);
            } else if (text.includes("age")) {
                reply = "What age range are you looking for? Choose: 18-25, 26-35, 36-45, or 45+";
                addChoiceButtons(["18-25", "26-35", "36-45", "45+"]);
            } else if (text.includes("color")) {
                reply = "What hair color do you prefer? Choose: Blonde, Brunette, Black, Red, or Any";
                addChoiceButtons(["Blonde", "Brunette", "Black", "Red", "Any"]);
            } else if (text.includes("weight")) {
                reply = "What body type do you prefer? Choose: Slim, Average, Athletic, Curvy, or Any";
                addChoiceButtons(["Slim", "Average", "Athletic", "Curvy", "Any"]);
            } else if (text.includes("height")) {
                reply = "What height range do you prefer? Choose: Short (<170cm), Average (170-180cm), Tall (>180cm), or Any";
                addChoiceButtons(["Short", "Average", "Tall", "Any"]);
            } else if (text.includes("form") || text.includes("profile")) {
                reply = "I can help you fill out your profile! Would you like to open the profile form? Choose: Yes or No";
                addChoiceButtons(["Yes", "No"]);
            } else if (text === "yes") {
                reply = "Opening the profile form now! Please fill in your details.";
                openForm();
            } else if (text === "no") {
                reply = "Okay, no problem! Ask me anything else.";
            } else if (text.includes("help")) {
                reply = "I can help with: Age, Color, Weight, Height, Profile form, or say 'Hello'!";
                addChoiceButtons(["Age", "Color", "Weight", "Height", "Form"]);
            } else {
                reply = "I can help you with profile suggestions! Ask me about: age, color, weight, height, or type 'form' to open the profile form.";
                addChoiceButtons(["Age", "Color", "Weight", "Height", "Form"]);
            }
            addAssistantMsg("bot", reply);
        }, 800);
    }

    function addChoiceButtons(choices) {
        const body = document.getElementById("assistantBody");
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = choice;
            btn.onclick = function() {
                document.getElementById("assistantInput").value = choice;
                sendAssistant();
            };
            body.appendChild(btn);
        });
        body.scrollTop = body.scrollHeight;
    }

    // Form functions
    function openForm() { document.getElementById("formPopup").style.display = "block"; }
    function closeForm() { document.getElementById("formPopup").style.display = "none"; }
    function saveForm() {
        const age = document.getElementById("formAge").value;
        const color = document.getElementById("formColor").value;
        const weight = document.getElementById("formWeight").value;
        const height = document.getElementById("formHeight").value;
        if (!age || !color || !weight || !height) { alert("Please fill all fields!"); return; }
        alert("Profile saved! Age: " + age + ", Hair: " + color + ", Weight: " + weight + "kg, Height: " + height + "cm");
        closeForm();
    }

    // Chat functions (human-like)
    let currentChatName = "";
    let replyTimer = null;

    function openChat(name) {
        currentChatName = name;
        document.getElementById("chatName").textContent = name;
        document.getElementById("chatModal").style.display = "flex";
        document.getElementById("chatMessages").innerHTML = "";
        // Simulate profile starting the convo after a delay
        setTimeout(() => {
            addMessage("profile", "Hi! I'm " + name.split(",")[0] + ". Nice to see you 😊");
        }, 1500);
    }

    function closeChat() {
        document.getElementById("chatModal").style.display = "none";
        clearTimeout(replyTimer);
    }

    function addMessage(sender, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + sender;
        msgDiv.textContent = text;
        document.getElementById("chatMessages").appendChild(msgDiv);
        document.getElementById("chatMessages").scrollTop = document.getElementById("chatMessages").scrollHeight;
    }

    function sendChat() {
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (text === "") return;
        addMessage("user", text);
        input.value = "";
        clearTimeout(replyTimer);

        // Show typing indicator
        const typingDiv = document.createElement("div");
        typingDiv.className = "msg profile typing";
        typingDiv.id = "typing-indicator";
        typingDiv.textContent = "Typing...";
        document.getElementById("chatMessages").appendChild(typingDiv);
        document.getElementById("chatMessages").scrollTop = document.getElementById("chatMessages").scrollHeight;

        // Human-like delay: 3 to 7 seconds based on message length
        const delay = 3000 + (text.length * 50) + Math.random() * 2000;
        replyTimer = setTimeout(() => {
            const typingEl = document.getElementById("typing-indicator");
            if (typingEl) typingEl.remove();
            
            const smartReply = getSmartReply(text);
            addMessage("profile", smartReply);
        }, delay);
    }

    // Init
    window.onload = function() {
        loadProfiles();
    };
</script>

</body>
</html>
