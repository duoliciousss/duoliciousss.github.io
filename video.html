<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video with Ad</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; max-width: 100%; }
        video { width: 100%; max-width: 800px; display: block; margin: 20px auto; border-radius: 10px; }

        /* Responsive floating ad */
        .ad-overlay {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 250px;
            max-width: 90vw;
            background: #d6336c;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            z-index: 9999;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            .ad-overlay { width: 150px; font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>Watch Video</h1>
        <video id="my-video" muted autoplay playsinline loop controls>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Floating Responsive Demo Ad Overlay -->
    <div class="ad-overlay" id="demoAd">
        <span>▶ Click Here</span>
    </div>

    <script>
        // Auto-play the video
        var vid = document.getElementById('my-video');
        vid.play().catch(function(){});

        // Demo click overlay (visual only, no real click sent)
        var adEl = document.getElementById('demoAd');
        adEl.onclick = function() {
            adEl.style.background = 'green';
            adEl.innerHTML = '✔ Clicked!';
            setTimeout(function() {
                adEl.style.background = '#d6336c';
                adEl.innerHTML = '▶ Click Here';
            }, 1000);
        };

        // Load Fluid Player with real VAST ad (auto-play, loop)
        var script = document.createElement('script');
        script.src = 'https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js';
        script.onload = function() {
            fluidPlayer('my-video', {
                vastOptions: {
                    adList: [{ roll: "preRoll", vastTag: "https://s.magsrv.com/v1/vast.php?idzone=6021516" }]
                },
                layoutControls: {
                    autoPlay: true,
                    loop: true,
                    allowFullscreen: true
                }
            });
        };
        document.head.appendChild(script);
    </script>

</body>
</html>
