<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video with Ad</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; }

        /* Floating demo ad button */
        .demo-ad {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 200px;
            background: #d6336c;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .demo-ad.clicked { background: green; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>Watch Video</h1>
    </div>

    <!-- Floating demo ad button -->
    <div class="demo-ad" id="demoAd">▶ Click Here</div>

    <script>
        // Create and auto-play video (NO Fluid Player)
        var vid = document.createElement('video');
        vid.muted = true;
        vid.playsinline = true;
        vid.loop = true;
        vid.autoplay = true;
        vid.controls = true;
        vid.style.width = '100%';
        vid.style.maxWidth = '800px';
        vid.style.display = 'block';
        vid.style.margin = '20px auto';
        vid.style.borderRadius = '10px';
        vid.innerHTML = '<source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">';
        document.body.appendChild(vid);
        vid.play().catch(function(){});

        // Click Here button works
        var demoAd = document.getElementById('demoAd');
        demoAd.onclick = function() {
            demoAd.classList.add('clicked');
            demoAd.innerHTML = '✔ Clicked!';
            setTimeout(function() {
                demoAd.classList.remove('clicked');
                demoAd.innerHTML = '▶ Click Here';
            }, 1000);
        };
    </script>

</body>
</html>
