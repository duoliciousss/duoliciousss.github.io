<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>Welcome to the video page</h1>
        <p>The video is in the corner.</p>
    </div>

    <!-- Simple Small Floating Video (No Fluid Player) -->
    <script>
        var vid = document.createElement('video');
        vid.muted = true;
        vid.playsinline = true;
        vid.loop = true;
        vid.autoplay = true;
        vid.controls = true;
        vid.style.position = 'fixed';
        vid.style.right = '10px';
        vid.style.bottom = '10px';
        vid.style.width = '250px';
        vid.style.zIndex = '9999';
        vid.style.borderRadius = '10px';
        vid.style.boxShadow = '0 4px 10px rgba(0,0,0,0.5)';
        vid.innerHTML = '<source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">';
        document.body.appendChild(vid);
        vid.play().catch(function(){});
    </script>

</body>
</html>
