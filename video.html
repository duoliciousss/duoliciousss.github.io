<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #000; }
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; background: #d6336c; padding: 15px; text-align: center; z-index: 999; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .video-container { margin-top: 60px; width: 100%; height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="video-container">
        <video id="my-video" muted autoplay playsinline loop controls style="width: 100%; height: 100%;">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <script>
        var vid = document.getElementById("my-video");
        vid.play().catch(function(){});
        fluidPlayer('my-video', {
            vastOptions: {
                adList: [{ roll: "preRoll", vastTag: "https://s.magsrv.com/v1/vast.php?idzone=6021516" }]
            }
        });
    </script>

</body>
</html>
