<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; }
        video { width: 100%; max-width: 800px; display: block; margin: 20px auto; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>Watch Video</h1>
        <video id="my-video" controls playsinline>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <script>
        var vid = document.getElementById('my-video');
        vid.muted = true; // Required for autoplay
        vid.play().catch(function(){});

        fluidPlayer('my-video', {
            vastOptions: {
                adList: [
                    {
                        roll: "preRoll",
                        vastTag: "https://s.magsrv.com/v1/vast.php?idzone=6021516"
                    }
                ]
            },
            layoutControls: {
                autoPlay: true,
                loop: true,
                allowFullscreen: true
            }
        });
    </script>

</body>
</html>
