<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Explanation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; }
        video { width: 100%; max-width: 800px; display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>How to Use Serenade Dates</h1>
        <p>Watch this video to learn how the site works.</p>
    </div>

    <video id="my-video" controls playsinline style="width: 100%; max-width: 800px; display: block; margin: 20px auto;">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script>
        // Auto-play with sound (needs user interaction for sound, so we'll start muted and then unmute on first interaction)
        var vid = document.getElementById("my-video");
        vid.muted = false; // Allow sound
        vid.play().catch(function() {
            // If autoplay blocked, show a play button
            vid.controls = true;
        });

        // Try to unmute on first click
        document.addEventListener("click", function() {
            vid.muted = false;
            vid.play().catch(function(){});
        });
    </script>

</body>
</html>
