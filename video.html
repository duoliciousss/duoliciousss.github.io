<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .top-nav { background: #d6336c; padding: 15px; text-align: center; }
        .top-nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .content { padding: 20px; }
        video { width: 100%; max-width: 800px; display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="New_user.html">Matches</a>
    </div>

    <div class="content">
        <h1>Watch Video</h1>
    </div>

    <script>
        var vid = document.createElement('video');
        vid.muted = true;
        vid.playsinline = true;
        vid.loop = true;
        vid.autoplay = true;
        vid.controls = true;
        vid.style.width = '100%';
        vid.style.maxWidth = '800px';
        vid.style.display = 'block';
        vid.style.margin = '20px auto';
        vid.innerHTML = '<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">';
        document.body.appendChild(vid);
        vid.play().catch(function(){});
    </script>

</body>
</html>
